# =========================================================
# SIGAP — Sistem Informasi Gangguan & Pelaporan
# PT Kebon Agung Pabrik Gula Trangkil
# Docker Compose Configuration File
# =========================================================

version: "3.8"

services:
  # -------------------------------------------------------
  # Service 1: Database MySQL 8.0
  # -------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: sigap-db
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: sigap_root_password_2026
      MYSQL_DATABASE: sigap_db
      MYSQL_USER: sigap_user
      MYSQL_PASSWORD: sigap_password_2026
    expose:
      - "3306"
    volumes:
      # Data persisten MySQL agar tidak hilang saat container dimatikan
      - sigap_mysql_data:/var/lib/mysql
      # Auto-import skema dan akun superadmin bawaan saat container pertama kali dibuat
      - ./sigap_mysql_dump.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -psigap_root_password_2026 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sigap_network

  # -------------------------------------------------------
  # Service 2: Aplikasi Web SIGAP (Next.js 16 + Prisma)
  # -------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigap-app
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      # Koneksi database: prioritaskan .env, fallback ke container 'db'
      - DATABASE_URL=${DATABASE_URL:-mysql://sigap_user:sigap_password_2026@db:3306/sigap_db}
      - JWT_SECRET=${JWT_SECRET:-sigap-pg-trangkil-secret-jwt-key-2026}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3002}
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigap_network

  # -------------------------------------------------------
  # Service 3: phpMyAdmin Visual Database Manager (Web GUI)
  # -------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: sigap-pma
    restart: unless-stopped
    ports:
      - "8083:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - UPLOAD_LIMIT=64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sigap_network

# ---------------------------------------------------------
# Volume Persistensi Data
# ---------------------------------------------------------
volumes:
  sigap_mysql_data:
    name: sigap_mysql_data

# ---------------------------------------------------------
# Jaringan Internal Docker
# ---------------------------------------------------------
networks:
  sigap_network:
    name: sigap_network
    driver: bridge
